<template>
  <div class="slds-form-element">
    <label class="slds-form-element__label" for="combobox-input">{label}</label>
    <div class="slds-form-element__control">
      <div class={comboboxClass}>
        <div
          class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right"
          role="none"
        >
          <span class="slds-icon_container slds-icon-utility-search slds-input__icon slds-input__icon_left">
            <lightning-icon icon-name="utility:search" size="x-small" variant="bare"></lightning-icon>
          </span>
          <input
            id="combobox-input"
            type="text"
            class="slds-input slds-combobox__input"
            autocomplete="off"
            role="combobox"
            aria-expanded={open}
            aria-haspopup="listbox"
            placeholder={placeholder}
            value={searchTerm}
            oninput={handleInput}
            onfocus={handleFocus}
            onblur={handleBlur}
          />
          <template if:true={hasSelection}>
            <button
              class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
              title="Clear"
              onclick={handleClear}
            >
              <lightning-icon icon-name="utility:clear" size="x-small" variant="bare"></lightning-icon>
              <span class="slds-assistive-text">Clear</span>
            </button>
          </template>
        </div>

        <div class="slds-dropdown slds-dropdown_length-7 slds-dropdown_fluid" role="listbox">
          <ul class="slds-listbox slds-listbox_vertical" role="presentation">
            <template if:true={hasOptions}>
              <template for:each={filteredOptions} for:item="opt">
                <li key={opt.value} role="presentation" class="slds-listbox__item">
                  <div
                    class={opt.itemClass}
                    role="option"
                    data-value={opt.value}
                    onmousedown={handleSelect}
                  >
                    <span class="slds-media__body">
                      <span class="slds-truncate" title={opt.label}>{opt.label}</span>
                    </span>
                  </div>
                </li>
              </template>
            </template>
            <template if:false={hasOptions}>
              <li role="presentation" class="slds-listbox__item">
                <div class="slds-listbox__option slds-listbox__option_plain slds-media slds-media_small">
                  <span class="slds-media__body slds-text-color_weak">No matches</span>
                </div>
              </li>
            </template>
          </ul>
        </div>
      </div>
    </div>
  </div>
</template>
