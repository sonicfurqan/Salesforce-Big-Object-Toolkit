<template>
  <lightning-card icon-name="standard:dashboard">
    <span slot="title">Big Object Tooling Dashboard</span>
    <div slot="actions" class="slds-grid slds-grid_vertical-align-center">
      <template if:true={hasData}>
        <span class="slds-text-body_small slds-text-color_weak slds-m-right_x-small">Master Switch</span>
        <span class={masterSwitchClass}>{masterSwitchLabel}</span>
      </template>
      <lightning-button-icon
        icon-name="utility:refresh"
        alternative-text="Refresh"
        title="Refresh"
        class="slds-m-left_x-small"
        onclick={handleRefresh}
      ></lightning-button-icon>
    </div>

    <div class="slds-card__body slds-card__body_inner">
      <!-- Loading -->
      <template if:true={loading}>
        <div class="slds-align_absolute-center slds-p-vertical_large">
          <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </div>
      </template>

      <!-- Error -->
      <template if:true={error}>
        <div class="slds-box slds-theme_error slds-m-bottom_small" role="alert">{error}</div>
      </template>

      <template if:true={hasData}>
        <!-- KPI tiles -->
        <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_medium">
          <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-bottom_small">
            <div class="slds-box slds-box_x-small slds-text-align_center bot-kpi">
              <div class="slds-text-heading_large">{jobs.totalProcessed}</div>
              <div class="slds-text-title slds-text-color_weak">Records Archived</div>
            </div>
          </div>
          <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-bottom_small">
            <div class="slds-box slds-box_x-small slds-text-align_center bot-kpi">
              <div class="slds-text-heading_large">{jobs.totalRuns}</div>
              <div class="slds-text-title slds-text-color_weak">Job Runs</div>
            </div>
          </div>
          <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-bottom_small">
            <div class="slds-box slds-box_x-small slds-text-align_center bot-kpi">
              <div class="slds-text-heading_large slds-text-color_success">{successRate}</div>
              <div class="slds-text-title slds-text-color_weak">Success Rate</div>
            </div>
          </div>
          <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-bottom_small">
            <div class="slds-box slds-box_x-small slds-text-align_center bot-kpi">
              <div class="slds-text-heading_large slds-text-color_error">{jobs.failedRuns}</div>
              <div class="slds-text-title slds-text-color_weak">Failed Runs</div>
            </div>
          </div>
        </div>

        <!-- Failed-run alert -->
        <template if:true={jobs.failedRuns}>
          <div class="slds-notify slds-notify_alert slds-theme_warning slds-m-bottom_medium" role="alert">
            <span class="slds-assistive-text">Warning</span>
            <lightning-icon
              icon-name="utility:warning"
              size="x-small"
              variant="inverse"
              class="slds-m-right_x-small"
            ></lightning-icon>
            <h2>{jobs.failedRuns} job run(s) reported failures. Review the recent runs below.</h2>
          </div>
        </template>

        <!-- Configuration coverage + toggles -->
        <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_medium">
          <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
            <article class="slds-box slds-box_small">
              <h3 class="slds-text-title_caps slds-m-bottom_small">Field History Logging</h3>
              <dl class="slds-dl_horizontal">
                <dt class="slds-dl_horizontal__label slds-text-color_weak">Configs</dt>
                <dd class="slds-dl_horizontal__detail">{config.logTotal}</dd>
                <dt class="slds-dl_horizontal__label slds-text-color_weak">Active</dt>
                <dd class="slds-dl_horizontal__detail">{config.logActive}</dd>
                <dt class="slds-dl_horizontal__label slds-text-color_weak">Trigger Ready</dt>
                <dd class="slds-dl_horizontal__detail">{config.logTriggered}</dd>
              </dl>
              <div class="slds-m-top_small">
                <span class="slds-text-color_weak slds-m-right_x-small">Logging</span>
                <span class={loggingClass}>{loggingLabel}</span>
              </div>
            </article>
          </div>
          <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
            <article class="slds-box slds-box_small">
              <h3 class="slds-text-title_caps slds-m-bottom_small">Data Archiving</h3>
              <dl class="slds-dl_horizontal">
                <dt class="slds-dl_horizontal__label slds-text-color_weak">Configs</dt>
                <dd class="slds-dl_horizontal__detail">{config.archiveTotal}</dd>
                <dt class="slds-dl_horizontal__label slds-text-color_weak">Active</dt>
                <dd class="slds-dl_horizontal__detail">{config.archiveActive}</dd>
              </dl>
              <div class="slds-m-top_small">
                <span class="slds-text-color_weak slds-m-right_x-small">Archiving</span>
                <span class={archivingClass}>{archivingLabel}</span>
              </div>
            </article>
          </div>
        </div>

        <!-- Runs by type -->
        <template if:true={hasTypeStats}>
          <h3 class="slds-text-title_caps slds-m-bottom_x-small">Runs by Job Type</h3>
          <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_medium">
            <template for:each={jobs.byType} for:item="t">
              <div key={t.jobType} class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3 slds-p-bottom_small">
                <div class="slds-box slds-box_x-small">
                  <div class="slds-text-title_bold">{t.jobType}</div>
                  <div class="slds-text-body_small slds-text-color_weak">
                    {t.runs} run(s) · {t.recordsProcessed} processed · {t.recordsFailed} failed
                  </div>
                </div>
              </div>
            </template>
          </div>
        </template>

        <!-- Recent job runs -->
        <h3 class="slds-text-title_caps slds-m-bottom_x-small">Recent Job Runs</h3>
        <template if:true={hasRecentJobs}>
          <lightning-datatable
            key-field="rowKey"
            data={jobs.recent}
            columns={jobColumns}
            hide-checkbox-column
            column-widths-mode="auto"
          ></lightning-datatable>
        </template>
        <template if:false={hasRecentJobs}>
          <div class="slds-box slds-box_xx-small slds-text-align_center slds-text-color_weak">
            No job runs recorded yet. Archive and export jobs will appear here once they run.
          </div>
        </template>

        <p class="slds-text-body_small slds-text-color_weak slds-m-top_small slds-text-align_right">
          Last updated
          <lightning-formatted-date-time
            value={generatedAt}
            year="numeric"
            month="short"
            day="2-digit"
            hour="2-digit"
            minute="2-digit"
          ></lightning-formatted-date-time>
        </p>
      </template>
    </div>
  </lightning-card>
</template>
