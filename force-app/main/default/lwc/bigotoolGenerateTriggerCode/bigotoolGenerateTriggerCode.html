<template>
  <div class="slds-p-around_medium">
    <template if:true={isLoading}>
      <lightning-spinner alternative-text="Generating" size="small"></lightning-spinner>
    </template>

    <template if:true={showConfirm}>
      <div class="slds-text-heading_small slds-m-bottom_small">Generate field-history trigger code?</div>
      <p class="slds-m-bottom_medium">
        This will generate the Apex trigger code needed to capture field history for this object and mark the
        configuration as
        <strong>Trigger Generated</strong>
        . You will still need to add the generated code to a trigger and deploy it. Continue?
      </p>
      <div class="slds-grid slds-grid_align-end">
        <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-right_x-small"></lightning-button>
        <lightning-button variant="brand" label="Generate" onclick={handleConfirm}></lightning-button>
      </div>
    </template>

    <template if:true={showResult}>
      <template if:true={result.alreadyGenerated}>
        <div class="slds-box slds-theme_info slds-m-bottom_small">
          Trigger code was already generated for this configuration. Here is how to add it to your object.
        </div>
      </template>
      <div class="slds-text-heading_small slds-m-bottom_x-small">Trigger: {result.triggerName}</div>
      <p class="slds-m-bottom_x-small">
        Object: {result.objectLabel} ({result.objectApiName}) &middot; Events: {result.events}
      </p>

      <div class="slds-form-element slds-m-bottom_small">
        <div class="slds-form-element__control">
          <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
            <span class="slds-text-title_caps">Generated code</span>
            <lightning-button label="Copy" icon-name="utility:copy" onclick={handleCopy}></lightning-button>
          </div>
          <pre class="code-block slds-box slds-theme_shade slds-text-font_monospace slds-scrollable_x">
{result.triggerBody}</pre
          >
        </div>
      </div>

      <div class="slds-form-element slds-m-bottom_medium">
        <span class="slds-text-title_caps">Instructions</span>
        <pre class="slds-box slds-text-longform slds-m-top_xx-small instruction-block">{result.instructions}</pre>
      </div>

      <div class="slds-grid slds-grid_align-end">
        <lightning-button variant="brand" label="Done" onclick={handleClose}></lightning-button>
      </div>
    </template>
  </div>
</template>
